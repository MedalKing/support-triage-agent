# Live evals against Claude, started by hand from the Actions tab.
#
# No API key is stored in GitHub. The job asks GitHub for a short-lived OIDC token and the
# Anthropic SDK exchanges it for a 10-minute access token (workload identity federation).
# The federation rule only accepts workflow_dispatch runs on main of this repository.
# The IDs below are identifiers, not secrets.
name: Live evals

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01L8RTZVcVivp3HPWTWkEw4G
      ANTHROPIC_ORGANIZATION_ID: f3c3f379-3055-45a0-95c1-eeff4acabbbd
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_011w6E38cHeAst3wkB4MtZyC
      ANTHROPIC_WORKSPACE_ID: wrkspc_0118toBRsgwV6VcB69JnAztr
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-oidc.jwt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fetch GitHub OIDC token for the Anthropic API
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            require('fs').writeFileSync(process.env.ANTHROPIC_IDENTITY_TOKEN_FILE, token, { mode: 0o600 });
      - name: Run evals
        # The access token lives 10 minutes and the identity token can be exchanged only once,
        # so the run must finish well inside that. A failed case fails the job.
        timeout-minutes: 8
        run: python evals/run_evals.py --provider claude --out eval-report.json
      - name: Remove the identity token
        if: always()
        run: rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-report
          path: eval-report.json
